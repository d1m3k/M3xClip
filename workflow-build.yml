# M3xClip — build .exe Windows otomatis (GitHub Actions)
#
# CARA PAKAI (rute A, rekomendasi):
#   File ini disimpan di ROOT repo dengan nama workflow-build.yml.
#   Konektor GitHub TIDAK BISA push folder .github/, jadi user harus
#   copy file ini sendiri lewat web UI GitHub:
#     1. Buka repo di github.com -> tab Actions -> "set up a workflow yourself"
#        (atau buat file baru di .github/workflows/build.yml)
#     2. Copy SELURUH isi file ini ke sana, lalu Commit.
#     3. Setiap push ke repo, Actions otomatis build .exe dan hasilnya
#        bisa didownload di tab Actions -> Artifacts -> M3xClip-windows.
#
# JANGAN buat folder .github/ di repo ini — file ini sengaja di root.

name: Build M3xClip Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download ffmpeg (essentials)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_dl
          Copy-Item (Get-ChildItem ffmpeg_dl\*\bin\ffmpeg.exe).FullName -Destination tools\ffmpeg.exe
          tools\ffmpeg.exe -version

      - name: Build .exe dengan PyInstaller
        run: |
          pyinstaller --onefile --windowed --name M3xClip --add-binary "tools/ffmpeg.exe;." main.py

      - name: Upload artifact .exe
        uses: actions/upload-artifact@v4
        with:
          name: M3xClip-windows
          path: dist/M3xClip.exe
